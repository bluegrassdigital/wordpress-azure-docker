name: Publish GitHub Release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v2025.08.21)"
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE_NAME: bluegrassdigital/wordpress-azure-sync
    steps:
      - name: Determine tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ "$TAG" != v* ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "Expected a valid release tag starting with v." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          awk '$0 == "#### " ENVIRON["TAG"] {found=1; next} /^#### / {found=0} found' CHANGELOG.md > RELEASE_NOTES.md
          echo "Release notes generated for $TAG:" && cat RELEASE_NOTES.md

      - name: Resolve release revision and PHP branches
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          php_versions="$(docker buildx bake -f docker-bake.hcl --print default | jq -er '[.target[].args.PHP_VERSION] | sort | select(length > 0) | join(" ")')"
          echo "RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "RELEASE_PHP_BRANCHES=$php_versions" >> "$GITHUB_ENV"

      - name: Append image tag references
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          read -r -a versions <<< "$RELEASE_PHP_BRANCHES"
          DOCKER_HUB_BASE="https://hub.docker.com/r/${IMAGE_NAME}/tags?name="

          # Find previous release tag for compare link
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | awk -v cur="$TAG" 'BEGIN{found=0} { if(found==1){ print $0; exit } if($0==cur){ found=1 } }')

          # Prepend compare link if previous tag exists
          if [ -n "${PREV_TAG:-}" ]; then
            tmpfile=$(mktemp)
            printf "### Changes since last release\n\n[Compare %s...%s](https://github.com/%s/compare/%s...%s)\n\n" "$PREV_TAG" "$TAG" "${GITHUB_REPOSITORY}" "$PREV_TAG" "$TAG" > "$tmpfile"
            cat RELEASE_NOTES.md >> "$tmpfile"
            mv "$tmpfile" RELEASE_NOTES.md
          fi

          image_link() {
            local tag="$1"
            printf '[`%s:%s`](%s%s)' "$IMAGE_NAME" "$tag" "$DOCKER_HUB_BASE" "$tag"
          }

          {
            printf "\n### Images and tags\n\n"
            for version in "${versions[@]}"; do
              prod_tag="$version-build-$RELEASE_REVISION"
              prod_full=$(docker run --rm --entrypoint php "$IMAGE_NAME:$prod_tag" -r 'echo PHP_VERSION;' 2>/dev/null || true)
              dev_full=$(docker run --rm --entrypoint php "$IMAGE_NAME:$version-dev-stable" -r 'echo PHP_VERSION;' 2>/dev/null || true)

              printf -- "- PHP %s\n" "$version"
              printf "  - Prod: %s, %s" "$(image_link "$version-latest")" "$(image_link "$version-stable")"
              if [[ "$prod_full" == "$version".* ]]; then
                printf ", %s, %s" "$(image_link "$prod_tag")" "$(image_link "$prod_full")"
              fi
              printf "\n  - Dev: %s, %s" "$(image_link "$version-dev-latest")" "$(image_link "$version-dev-stable")"
              if [[ "$dev_full" == "$version".* ]]; then
                printf ", %s" "$(image_link "$dev_full-dev")"
              fi
              printf "\n\n"
            done
          } >> RELEASE_NOTES.md
          printf "Appended image tags and compare link (if available).\n"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        continue-on-error: true
        with:
          version: v0.70.0

      - name: Scan release images
        run: |
          scan_image() {
            local image="$1" report="$2"
            if ! trivy image --scanners vuln --pkg-types os,library --ignore-unfixed \
              --severity CRITICAL,HIGH --format table --output "$report" "$image"; then
              rm -f "$report"
              echo "::warning::Could not scan $image"
            fi
          }

          if ! command -v trivy >/dev/null; then
            echo "::warning::Trivy is unavailable"
            exit 0
          fi
          read -r -a versions <<< "$RELEASE_PHP_BRANCHES"
          for version in "${versions[@]}"; do
            scan_image "$IMAGE_NAME:$version-build-$RELEASE_REVISION" "trivy-$version-prod.txt"
            scan_image "$IMAGE_NAME:$version-dev-stable" "trivy-$version-dev.txt"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: trivy-*.txt
          make_latest: true
