name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4"]
        target: [runtime, dev]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub (optional)
        if: ${{ github.actor != 'dependabot[bot]' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and load test image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: PHP_VERSION=${{ matrix.php_version }}
          tags: local/wazm:ci
          cache-from: type=gha,scope=ci-${{ matrix.php_version }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.php_version }}-${{ matrix.target }}

      - name: Verify PHP session upload progress default and opt-in
        run: bash scripts/smoke-test-session-upload-progress.sh local/wazm:ci

      - name: Smoke test
        run: |
          bash scripts/smoke-test.sh local/wazm:ci


