name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4", "8.5", "8.6"]
        target: [runtime, dev]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check workflow hardening
        if: matrix.php_version == '8.4' && matrix.target == 'runtime'
        run: python3 scripts/test-security.py WorkflowSecurity

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub (optional)
        if: ${{ github.actor != 'dependabot[bot]' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and load test image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: PHP_VERSION=${{ matrix.php_version }}
          tags: local/wazm:ci
          cache-from: type=gha,scope=ci-${{ matrix.php_version }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.php_version }}-${{ matrix.target }}

      - name: Verify PHP and WordPress on Apache
        env:
          PHP_BRANCH: ${{ matrix.php_version }}
          IMAGE_VARIANT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint printenv local/wazm:ci PHP_VERSION)"
          if [[ "$version" != "$PHP_BRANCH".* ]]; then
            echo "Expected PHP $PHP_BRANCH, found $version" >&2
            exit 1
          fi
          bash scripts/smoke-test-php.sh local/wazm:ci "$version" "$IMAGE_VARIANT"

      - name: Check runtime hardening
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD:/workspace:ro" -w /workspace local/wazm:ci \
            -euc 'test -x /usr/local/bin/write-container-env.sh
                  ENV_WRITER=/usr/local/bin/write-container-env.sh \
                    python3 scripts/test-security.py EnvironmentSecurity ConfigSecurity
                  php scripts/test-log-security.php'

      - name: Verify PHP session upload progress default and opt-in
        run: bash scripts/smoke-test-session-upload-progress.sh local/wazm:ci

      - name: Smoke test
        run: |
          bash scripts/smoke-test.sh local/wazm:ci


